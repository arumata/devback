version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  relative-path-mode: cfg

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - gocyclo
    - goconst
    - misspell
    - lll
    - depguard
    - gochecknoglobals
    - godox          # forbid TODO/FIXME/HACK
    - unused
    - ineffassign
    - unparam
    - gocritic
    - gosec          # security checks
    - unconvert      # unnecessary conversions
    - dupl           # code duplication
    - prealloc       # slice preallocation
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    lll:
      line-length: 120
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G204  # allow subprocess with variables (git commands)
    prealloc:
      simple: true
      range-loops: true
    revive:
      rules:
        - name: exported
    depguard:
      rules:
        # Forbid direct system calls in the usecase layer
        usecase-restrictions:
          files:
            - "**/internal/usecase/*.go"
            - "**/internal/usecase/**/*.go"
            - "!$test"
          deny:
            - pkg: os
              desc: "Direct system calls are forbidden in usecase. Use adapters."
            - pkg: os/exec
              desc: "os/exec is forbidden in usecase. Use the git adapter."
            - pkg: path/filepath
              desc: "path/filepath is forbidden in usecase. Use the fs adapter."
            - pkg: syscall
              desc: "Direct syscalls are forbidden in usecase. Use adapters."
          include-go-root: true
        # Restrict os/exec to adapters only
        exec-restrictions:
          files:
            - "**/internal/*.go"
            - "**/internal/**/*.go"
            - "!**/internal/adapters/*.go"
            - "!**/internal/adapters/**/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: "os/exec is allowed only in internal/adapters/*"
          include-go-root: true

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/arumata/devback)
        - prefix(github.com/)
    gofumpt:
      # Module path which contains the source code being formatted.
      # Default: ""
      module-path: github.com/arumata/devback
      # Choose whether to use the extra rules.
      # Default: false
      extra-rules: true
      
issues:
  exclude-use-default: false
  exclude-rules:
    # Tests may have long lines and higher cyclomatic complexity
    - path: _test\.go
      linters:
        - gocyclo
        - lll
    # Allow TODO in tests (but not in shipped code)
    - path: _test\.go
      linters:
        - godox
    # Tests may use relaxed permissions and file operations
    - path: _test\.go
      linters:
        - gosec

output:
  sort-results: true

